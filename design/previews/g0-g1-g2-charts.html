<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>G0 G1 G2</title><style>
@font-face{font-family:P;font-weight:400;src:url(../fonts/PoppinsGP-Regular.ttf)}
@font-face{font-family:P;font-weight:500;src:url(../fonts/PoppinsGP-Medium.ttf)}
@font-face{font-family:P;font-weight:600;src:url(../fonts/PoppinsGP-SemiBold.ttf)}

body{margin:0;background:#2a2a2a;font:15px/22px P}.w{display:flex;flex-wrap:wrap;justify-content:center;gap:16px;padding:16px}
.col{display:flex;flex-direction:column;gap:8px;align-items:center}.cap{font:500 13px P;color:#ddd;min-height:18px;text-align:center;max-width:360px}
.ph{width:360px;height:860px;position:relative;overflow:hidden;background:var(--bg);color:var(--tp)}
.dark{--bg:#060606;--s1:#111111;--s3:#222222;--tp:#F5F5F5;--ts:#A3A3A3;--hl:rgba(255,255,255,.07);--line:#FF7A2F;--ga:0.24;--gain:#3DD68C;--loss:#FF6B7A;--brt:#FF7A2F}
.light{--bg:#F4F4F4;--s1:#FFFFFF;--s3:#E5E5E5;--tp:#0A0A0A;--ts:#5C5C5C;--hl:rgba(0,0,0,.07);--line:#D9560F;--ga:0.16;--gain:#0E7A43;--loss:#C8283C;--brt:#B4410F}
.bar{height:56px}.big{font:600 24px/32px P;padding:0 20px 8px}
.hero{font:600 32px/40px P;padding:0 20px;font-variant-numeric:tabular-nums;white-space:nowrap}
.chg{padding:2px 20px 0;font:500 14px/20px P;display:flex;gap:6px;align-items:center;min-height:20px}.chg .g{color:var(--gain);display:inline-flex;gap:4px;align-items:center}.chg .d{color:var(--ts);font-weight:400}
.per{margin:14px 20px 0;display:inline-flex;align-items:center;gap:6px;height:40px;padding:0 14px;border-radius:999px;background:var(--s3);font:400 13px P;color:var(--ts)}.per b{color:var(--tp);font-weight:600}
.chart{position:relative;margin-top:8px;height:210px}.chart svg{position:absolute;left:0;top:0}
.ax{position:absolute;right:20px;font:400 11px/14px P;color:var(--ts);font-variant-numeric:tabular-nums}
.xl{position:absolute;bottom:-2px;font:400 11px/14px P;color:var(--ts)}
.ctl{display:flex;align-items:center;gap:8px;padding:14px 20px 0}.ib{width:40px;height:40px;border-radius:50%;background:var(--s3);display:grid;place-items:center;color:var(--tp)}
.lnk{color:var(--brt);font:600 15px P;margin-left:auto}
.fresh{padding:8px 20px 0;font:400 12px/16px P;color:var(--ts)}
h4{margin:18px 20px 8px;font:600 13px/18px P;color:var(--ts)}
.card{margin:0 20px;background:var(--s1);border-radius:12px}
.q{height:60px;display:flex;align-items:center;gap:12px;padding:0 16px;border-bottom:1px solid var(--hl)}.q:last-child{border:0}.q .t{flex:1;font-weight:500}.q small{display:block;font:400 12px/16px P;color:var(--ts)}.q .v{text-align:right;font-weight:600;font-variant-numeric:tabular-nums;min-width:72px}.q .v small{font-weight:500}
.empty{height:120px;margin:8px 20px 0;border-radius:12px;border:1px dashed var(--hl);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--ts);font-size:13px;text-align:center}
.empty b{color:var(--tp);font-weight:500;font-size:15px}
button{font:500 13px P;padding:6px 10px;border-radius:999px;border:0;background:#444;color:#eee;margin:0 3px}
</style><body><div class="w" id="w"></div><script>
const TUP='<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 7h6v6"/><path d="m22 7-8.5 8.5-5-5L2 17"/></svg>';
const TDN='<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M16 17h6v-6"/><path d="m22 17-8.5-8.5-5 5L2 7"/></svg>';
const CL='<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>',CR='<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>';
const CD='<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>';
// fictitious data (seeded)
let seed=7;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
function series(n,start,drift,vol){const a=[start];for(let i=1;i<n;i++)a.push(a[i-1]*(1+drift+(rnd()-.5)*vol));return a}
const YTD=series(47,11.2e6,0.0032,0.018),M1=series(22,12.6e6,0.001,0.012);
const MONTHS=['janv.','févr.','mars','avr.','mai','juin','juil.','août','sept.','oct.','nov.'];
const fmt=v=>Math.round(v/100)*100;const sp=n=>String(n).replace(/\B(?=(\d{3})+(?!\d))/g,' ');
const W=360,H=210,PL=20,PR=56,PT=12,PB=26;
function geom(d){const mn=Math.min(...d),mx=Math.max(...d),pad=(mx-mn)*.12;const lo=mn-pad,hi=mx+pad;
 return {pts:d.map((v,i)=>[PL+i*(W-PL-PR)/(d.length-1),PT+(1-(v-lo)/(hi-lo))*(H-PT-PB)]),lo,hi}}
function smooth(p){let s=`M${p[0][0].toFixed(1)},${p[0][1].toFixed(1)}`;for(let i=1;i<p.length;i++){const [x0,y0]=p[i-1],[x1,y1]=p[i],cx=(x0+x1)/2;s+=` C${cx.toFixed(1)},${y0.toFixed(1)} ${cx.toFixed(1)},${y1.toFixed(1)} ${x1.toFixed(1)},${y1.toFixed(1)}`}return s}
function chartSVG(id,d,cursor){const g=geom(d),line=smooth(g.pts),area=line+` L${g.pts.at(-1)[0]},${H-PB} L${PL},${H-PB} Z`;
 let stops='';for(let k=0;k<=12;k++){const t=k/12;stops+=`<stop offset="${t}" stop-color="var(--line)" stop-opacity="calc(var(--ga) * ${(Math.pow(1-t,1.8)).toFixed(3)})"/>`}
 const ticks=[0.15,0.5,0.85].map(f=>{const v=g.hi-(g.hi-g.lo)*f;return `<div class="ax" style="top:${PT+f*(H-PT-PB)-7}px">${(v/1e6).toFixed(1).replace('.',',')} M</div>`}).join('');
 let cur='';if(cursor!=null){const [x,y]=g.pts[cursor];cur=`<line x1="${x}" x2="${x}" y1="${PT}" y2="${H-PB}" stroke="var(--ts)" stroke-opacity=".6" stroke-width="1"/><circle cx="${x}" cy="${y}" r="6" fill="var(--line)" stroke="var(--bg)" stroke-width="2.5"/>`}
 return `<svg width="${W}" height="${H}"><defs><linearGradient id="g${id}" x1="0" y1="0" x2="0" y2="1">${stops}</linearGradient></defs><path class="area" d="${area}" fill="url(#g${id})"/><path class="ln" d="${line}" fill="none" stroke="var(--line)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>${cur}</svg>${ticks}`+
 XL.map((m,i)=>`<div class="xl" style="left:${PL+i*(W-PL-PR)/3.3}px">${m}</div>`).join('')}
function spark(d,col){const mn=Math.min(...d),mx=Math.max(...d);const p=d.map((v,i)=>[2+i*52/(d.length-1),2+(1-(v-mn)/(mx-mn))*20]);return `<svg width="56" height="24"><path d="${smooth(p)}" fill="none" stroke="${col}" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/></svg>`}
const quotes=[['BRVM Composite','Différé ~15 min',series(30,230,.002,.02),'232,41','+1,2 %',1],['Valeur Kora','Différé ~15 min',series(30,24e3,-.003,.02),'23 450','−0,8 %',0],['S&P 500','Proxy SPY',series(30,560,.002,.015),'571,20','+0,6 %',1]];
function phone(theme,mode,cap){const scrub=mode==='scrub';const ci=31;const d=YTD;
 const val=scrub?sp(fmt(d[ci]))+' F CFA':sp(fmt(d.at(-1)))+' F CFA';
 const chg=scrub?`<span class="d">mardi 12 août 2026</span>`:`<span class="g">${TUP}+${sp(fmt(d.at(-1)-d[0]))} F (+${((d.at(-1)/d[0]-1)*100).toFixed(1).replace('.',',')} %)</span><span class="d">depuis le 1er janv.</span>`;
 let extra='';
 if(mode==='light'){extra=`<h4>G2 · Mini-courbes (cours, B9)</h4><div class="card">${quotes.map(q=>`<div class="q"><span class="t">${q[0]}<small>${q[1]}</small></span>${spark(q[2],q[5]?'var(--gain)':'var(--loss)')}<span class="v">${q[3]}<small style="color:${q[5]?'var(--gain)':'var(--loss)'}">${q[4]}</small></span></div>`).join('')}</div><h4>G0 · Moins de 2 points</h4><div class="empty"><b>Données insuffisantes</b>La courbe s'affichera après 2 jours de données.</div>`}
 else extra=`<div class="ctl"><span class="ib">${CL}</span><span class="ib">${CR}</span><span class="lnk">Voir en tableau</span></div><div class="fresh">${scrub?'Glissez le doigt sur la courbe · ‹ › point par point':'Mis à jour le 22 nov., 14:05'}</div>`;
 return `<div class="col"><div class="ph ${theme}"><div class="bar"></div><div class="big">Accueil</div><div class="hero">${val}</div><div class="chg">${chg}</div>
 <div class="per">Période <b>Année</b>${CD}</div><div class="chart" id="ch_${mode}">${chartSVG(mode,d,scrub?ci:null)}</div>${extra}</div><div class="cap" id="cap_${mode}">${cap}</div></div>`}
let timers=[];let XL=['janv.','avr.','juil.','oct.'];
const W0=document.getElementById('w');
const anim=!location.hash;
W0.innerHTML=phone('dark',anim?'live':'rest',anim?'Démo : tracé, lecture au doigt, changement de période':'G1 · courbe + dégradé léger (sombre)')+(anim?'':phone('dark','scrub','G0 · lecture au doigt : le montant du haut suit')+phone('light','light','G1 clair + G2 mini-courbes + état < 2 points'));
if(anim){W0.insertAdjacentHTML('beforeend','');document.querySelector('.col').insertAdjacentHTML('beforeend','<div><button onclick="run()">Rejouer</button></div>');run()}

async function run(){timers.forEach(clearTimeout);timers=[];const wait=ms=>new Promise(r=>timers.push(setTimeout(r,ms)));
 const ch=document.getElementById('ch_live'),cap=document.getElementById('cap_live'),hero=document.querySelector('.hero'),chg=document.querySelector('.chg'),per=document.querySelector('.per b');
 const draw=(d,cursor)=>{ch.innerHTML=chartSVG('live',d,cursor)};
 XL=['janv.','avr.','juil.','oct.'];const base=YTD;draw(base);per.textContent='Année';hero.textContent=sp(fmt(base.at(-1)))+' F CFA';
 const restChg=chg.innerHTML;
 // 1. line draw
 cap.textContent='1. Tracé de gauche à droite (1,1 s, fin douce) ; dégradé en fondu';
 const ln=ch.querySelector('.ln'),ar=ch.querySelector('.area'),L=ln.getTotalLength();
 ln.style.strokeDasharray=L;ln.style.strokeDashoffset=L;ar.style.opacity=0;ln.getBoundingClientRect();
 ln.style.transition='stroke-dashoffset 1100ms cubic-bezier(.22,1,.36,1)';ln.style.strokeDashoffset=0;ar.style.transition='opacity 700ms linear 400ms';ar.style.opacity=1;
 await wait(2200);
 // 2. scrub
 cap.textContent='2. Doigt sur la courbe : trait + point, le montant du haut suit';
 for(let i=46;i>=20;i--){draw(base,i);hero.textContent=sp(fmt(base[i]))+' F CFA';const dt=new Date(2026,0,1+Math.round(i*326/46));chg.innerHTML='<span class="d">'+dt.toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long',year:'numeric'})+'</span>';await wait(45)}
 await wait(900);draw(base);hero.textContent=sp(fmt(base.at(-1)))+' F CFA';chg.innerHTML=restChg;cap.textContent='Doigt levé : tout revient';await wait(1300);
 // 3. period morph YTD -> M1
 cap.textContent='3. Période « Mois » : la courbe se transforme (550 ms), puis les repères changent';per.textContent='Mois';
 const target=M1.map((_,i)=>i),n=47;const res=(arr)=>Array.from({length:n},(_,i)=>{const t=i*(arr.length-1)/(n-1),a=Math.floor(t),b=Math.min(a+1,arr.length-1);return arr[a]+(arr[b]-arr[a])*(t-a)});
 const A=base,B=res(M1),t0=performance.now();
 await new Promise(r=>{(function f(){let k=Math.min(1,(performance.now()-t0)/550);const e=k<.5?4*k*k*k:1-Math.pow(-2*k+2,3)/2;draw(A.map((v,i)=>v+(B[i]-v)*e));k<1?requestAnimationFrame(f):r()})()});
 hero.textContent=sp(fmt(M1.at(-1)))+' F CFA';XL=['25 oct.','2 nov.','9 nov.','16 nov.'];draw(B);chg.innerHTML='<span class="g">'+TUP+'+'+sp(fmt(M1.at(-1)-M1[0]))+' F (+'+((M1.at(-1)/M1[0]-1)*100).toFixed(1).replace('.',',')+' %)</span><span class="d">sur 1 mois</span>';await wait(2600);run()}
</script></body></html>
