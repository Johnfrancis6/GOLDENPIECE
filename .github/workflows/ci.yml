name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    name: python (money, schemas, generators)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install "pytest>=8" "jsonschema>=4.23" "numpy>=2"
      - name: Fixtures are up to date
        run: |
          python3 shared/fixtures/gen_money.py
          python3 shared/fixtures/gen_money_sql.py
          python3 shared/fixtures/gen_iban.py
          git diff --exit-code -- shared/fixtures supabase/tests/money_fixtures.test.sql supabase/tests/iban_fixtures.test.sql
      - name: pytest
        working-directory: batch
        run: python3 -m pytest -q

  deno:
    name: deno (edge functions)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: supabase/functions
    steps:
      - uses: actions/checkout@v5
      - uses: denoland/setup-deno@v2
        with:
          deno-version: "2.9.6"
      - run: deno fmt --check
      - run: deno lint
      - run: deno check */index.ts
      - run: deno test --allow-read --allow-env

  db:
    name: db (migrations + pgTAP on local Supabase)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: supabase/setup-cli@v1
        with:
          version: 3.3.0
      - name: Start local stack (migrations applied)
        run: supabase start -x studio,imgproxy,mailpit,edge-runtime,logflare,vector,supavisor,storage-api,postgres-meta
      - name: pgTAP
        run: supabase test db
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: denoland/setup-deno@v2
        with:
          deno-version: "2.9.6"
      - name: Load simulated-bank templates (B2 generator)
        working-directory: batch
        run: python3 -m goldenpiece.generator.sim_templates --sql | psql -v ON_ERROR_STOP=1 -q "postgresql://postgres:postgres@127.0.0.1:54322/postgres"
      - name: Provider contract (SimAdapter against the local stack)
        working-directory: supabase/functions
        run: |
          eval "$(supabase status -o env | sed -n 's/^API_URL=/export SUPABASE_URL=/p; s/^SERVICE_ROLE_KEY=/export SUPABASE_SERVICE_ROLE_KEY=/p; s/^SECRET_KEY=/export GP_SECRET_KEY=/p')"
          export SUPABASE_SERVICE_ROLE_KEY="${SUPABASE_SERVICE_ROLE_KEY:-$GP_SECRET_KEY}"
          test -n "$SUPABASE_URL" && test -n "$SUPABASE_SERVICE_ROLE_KEY"
          GP_CONTRACT=1 deno test --allow-read --allow-env --allow-net _shared/provider/live_contract_test.ts
      - name: Analytics batch on the local stack (psycopg transport, role batch_writer)
        working-directory: batch
        env:
          DB: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: |
          pip install "numpy>=2" "psycopg[binary]>=3.2"
          psql -v ON_ERROR_STOP=1 -q "$DB" <<'SQL'
          insert into auth.users (id, instance_id, aud, role, email, is_anonymous, created_at, updated_at)
          values ('00000000-0000-4000-b000-0000000000c4', '00000000-0000-0000-0000-000000000000', 'authenticated',
                  'authenticated', null, true, now(), now());
          insert into mkt.fx_daily (d, quote, rate) values (current_date - 800, 'USD', 1.10);
          select api.demo_start('00000000-0000-4000-b000-0000000000c4', 'diaspora_investor');
          SQL
          GP_DB_URL="$DB" python3 -m goldenpiece.analytics --job batch-nightly
          test "$(psql -tA "$DB" -c "select count(*) from analytics.performance where status = 'ok'")" -ge 1
          test "$(psql -tA "$DB" -c "select count(*) from ops.recompute_queue")" -eq 0
      - if: always()
        run: supabase stop --no-backup || true
